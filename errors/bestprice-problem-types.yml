- status: 200
  title: Tool domain error
  type: outputSchema error branch {error:{code,message,retryable}}
  description: 'Service failures such as an unknown product are tool results with isError: true, declared by all
    four tools; codes are not enumerated in the schema.'
  remediation: Branch on error.retryable.
