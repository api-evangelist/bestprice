entries:
- version: 1.4.3
  date: '2026-09-25'
  breaking: false
  highlights:
  - WebMCP contract 1.9 at the storefront's registration revision 2026-09-25.9 (bestprice.gr `2401b434d2`). The
    contract version, the 16 tools and every input are unchanged.
  - 'Lean output schemas. Every tool''s published output schema is the storefront''s lean projection of its strict
    contract: types, consts, enums, patterns, required fields and the success/refusal `oneOf` kept; bounds, formats,
    `additionalProperties` and non-essential descriptions dropped; objects nested two levels deep published as their
    type; refusals as `ok`/`error`/`reason` (search and details in full). About half the size; the package publishes
    them exactly as the storefront does.'
  - Strictness kept in the tests. The snapshot also records the storefront's strict contract (`webmcp/test/fixtures/storefront-strict-output-schemas.json`,
    from the same module the published schemas come from); every demo result is validated against both, and the
    parity test checks that each published schema only relaxes the strict one.
  scope: repository package (manifests, stdio bridge, WebMCP)
- version: 1.4.2
  date: '2026-09-25'
  breaking: false
  highlights:
  - WebMCP contract 1.9 as the storefront revised it again (bestprice.gr `21bce127ae`; registration revision 2026-09-25.8).
    The contract version and the 16 tools are unchanged.
  - '`get_product_details` is on the item page too: the product page registers 9 tools, the details tool right after
    `search_bestprice`, with its own wording there (`pageDescriptions.product`).'
  - 'Tools answer before the tab moves. Every tool that moves or reloads the tab answers first — `outcome: ''dispatched''`,
    `destination_url` or `bestprice_url`, and the `next_tools` the destination registers — and the navigation starts
    just after. `search_bestprice` says `results_kind: ''product''` when a search lands on one model''s own page;
    `get_product_details` answers within its deadline with the sections it could read (the rest `null`, with why),
    still opens the product with `navigate: true` when the read failed, and summarizes an excluded unknown-shipping
    offer as `cheapest_merchant`. The output schemas are leaner.'
  scope: repository package (manifests, stdio bridge, WebMCP)
- version: 1.4.1
  date: '2026-09-25'
  breaking: false
  highlights:
  - WebMCP contract 1.9 as the storefront revised it the same day (bestprice.gr `971aa25d79`, `b550a849e8`; registration
    revision 2026-09-25.7). The contract version and the 16 tools are unchanged.
  - '`search_bestprice` narrows by price, stock, deals and order: optional `min_price_eur`, `max_price_eur`, `sort`
    (`relevance`, `price_asc`, `price_desc`, `biggest_price_drop`, `most_stores`, `newest`), `in_stock_only` and
    `deals_only`; the result reports each requested constraint as `applied` or `not_applied`, with why.'
  - 'One product id form everywhere, digits only (`^\d{1,20}$`): `compare_page_offers`, `get_product_details` and
    `open_visible_product` share one schema, and the MCP server''s `bp_<id>` is refused with the digits to send.'
  scope: repository package (manifests, stdio bridge, WebMCP)
- version: 1.4.0
  date: '2026-09-25'
  breaking: false
  highlights:
  - WebMCP contract 1.9, as the BestPrice.gr storefront registers it (bestprice.gr `b43f47d55b`, after `867fcffe5a`).
  - '`get_product_details` — 16 tools. On the home page, listings and every other public page (not the item page,
    whose own tools cover the product in view), it reads one product by `product_id` — numeric, or `bp_<id>` — without
    moving the tab: its facts, up to four offers ranked by delivered price, key specifications and the price-history
    summary; `include` picks the sections. It is read-only.'
  - 'The `site` page type. Every other public BestPrice page — articles and guides, deals, lists, stores, brands,
    collections, comparisons, stories — registers `search_bestprice`, `get_product_details` and `get_shopping_decision`.
    `PAGE_TOOL_NAMES.site` and `createTools({ page: ''site'' })` publish it; the home page now registers 5 tools
    and listings 10.'
  scope: repository package (manifests, stdio bridge, WebMCP)
- version: 1.3.0
  date: '2026-09-25'
  breaking: false
  highlights:
  - WebMCP contract 1.8, as the BestPrice.gr storefront registers it (bestprice.gr `e0be10690f`).
  - '`get_shopping_decision` on every page — 15 tools. It asks the BestPrice Shopping Brain (the public MCP endpoint''s
    tool of the same name) with the shopper''s own words (`message`, 1–2000 characters) and an optional Greek `postal_code`
    (10000–85999), and returns the outcome, the pick with its lowest price before shipping and BestPrice link, up
    to three alternatives, reasons, tradeoffs, unknowns, and a clarifying question when one is needed. It is read-only
    and never moves the tab.'
  - '`search_bestprice` answers with its results. New optional `limit` (1–8, default 6) and `navigate` (default
    true; `false` only reads); the result carries the product cards, the results page and its kind, whether the
    tab moved, and the tools the results page registers.'
  scope: repository package (manifests, stdio bridge, WebMCP)
- version: 1.2.8
  date: '2026-09-25'
  breaking: false
  highlights:
  - 'The stdio bridge connects again on Node 24, 25 and 26. Since 1.2.1, `node stdio.mjs` failed every handshake
    on current Node (undici 7.12 and later): the MCP SDK cancels the empty body of the 202 that answers `notifications/initialized`,
    and the UTF-8 response guard reported that cancellation as an upstream stream failure, which aborted the shared
    upstream connection before `tools/list`. Hosts saw the fallback `bestprice-mcp-stdio` server and "This operation
    was aborted" on every call. A body the consumer discards is no longer a failure; invalid UTF-8, oversize and
    truncated bodies, and real read errors, are still reported exactly once. Node 20 to 23 were unaffected.'
  - CI now also runs the full test suite on the current Node line (26), so a runtime change like undici 7.12 cannot
    break the bridge unnoticed again.
  scope: repository package (manifests, stdio bridge, WebMCP)
