aid: bestprice
name: BestPrice Agent Commerce
type: Index
kind: company
visibility: Public
description: 'BestPrice.gr is Greece''s largest price-comparison marketplace, run by The Best Company S.A., covering
  roughly 25.7 million products from about 3,650 merchants and 42,000 manufacturers with hourly merchant-feed refreshes.
  Its developer surface is not a REST API but a public, keyless, read-only MCP server at https://mcp.bestprice.gr/mcp
  (server 1.8.1, MCP Registry id gr.bestprice/mcp), exposing four tools - get_shopping_decision (the BestPrice Shopping
  Brain: recommendations, need-based comparisons and read-only basket plans), search_products, compare_offers and
  get_price_history - whose JSON Schema 2020-12 input and output contracts are served live and anonymously. Alongside
  it BestPrice publishes a provider-authored Agent Skill, an APIs.json 0.23 index, an llms.txt, an RFC 9116 security.txt,
  an Agentic Resource Discovery manifest, an AI catalog, an MCP server card, a stdio bridge for hosts that cannot
  speak HTTP, and an experimental WebMCP manifest of 16 browser-tab tools.'
