aid: bestprice
name: BestPrice Agent Commerce
type: Index
kind: company
visibility: Public
description: >-
  BestPrice.gr is Greece's largest price-comparison marketplace, run by The Best Company S.A.,
  covering roughly 25.7 million products from about 3,650 merchants and 42,000 manufacturers with
  hourly merchant-feed refreshes. Its developer surface is not a REST API but a public, keyless,
  read-only MCP server at https://mcp.bestprice.gr/mcp, exposing three tools - search_products,
  compare_offers and get_price_history - whose JSON Schema 2020-12 input and output contracts are
  served live and anonymously. Alongside it BestPrice publishes an APIs.json 0.23 index, an llms.txt,
  an RFC 9116 security.txt, an Agentic Resource Discovery manifest and an experimental WebMCP
  manifest of 13 browser-tab tools.
