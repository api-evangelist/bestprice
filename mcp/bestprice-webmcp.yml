name: BestPrice WebMCP (browser-tab tools)
status: experimental
note: >-
  This is a SECOND and distinct agent surface, not another copy of the remote MCP server. WebMCP
  tools are registered by the BestPrice page itself into a compatible Chrome tab, so they only exist
  while the shopper has that tab open — an assistant cannot reach them headlessly the way it reaches
  https://mcp.bestprice.gr/mcp. The provider states the Chrome origin trial runs to 17 November 2026
  and that support may change.
