authentication:
  required: false
  schemes: []
  note: >-
    Verified anonymously. initialize, tools/list, resources/list and tools/call all returned 200 with
    no credential of any kind. Both /.well-known/oauth-protected-resource and
    /.well-known/oauth-authorization-server on mcp.bestprice.gr return 404, consistent with an
    unauthenticated public surface. The published server card sets authentication.required = false.
tools:
- name: search_products
  title: Search BestPrice products
  summary: Find grouped BestPrice products from a natural-language description when the product_id is unknown.
  required: [query]
  optional: [locale, country, price_min, price_max, required_features, sort, limit]
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  input_schema: ../json-schema/bestprice-search-products-input.json
  output_schema: ../json-schema/bestprice-search-products-output.json
  limits: >-
    At most 8 grouped products. Covers reviewed technology, appliance and home-and-garden categories
    only — not services, digital goods or regulated goods. price_from excludes shipping.
- name: compare_offers
  title: Compare BestPrice offers
  summary: Compare current merchant offers for one product by delivered total cost at a Greek postal code.
  required: [product_id, postal_code]
  optional: [objective, in_stock_only, minimum_merchant_rating, limit]
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  input_schema: ../json-schema/bestprice-compare-offers-input.json
  output_schema: ../json-schema/bestprice-compare-offers-output.json
  limits: >-
    1-10 offers, default 10. product_id must match bp_<id>; postal_code must match ^[0-9]{5}$.
    item_price, shipping_price and total_price are returned separately and total_price stays null
    when shipping_status is not "known" — unknown shipping is never treated as zero.
- name: get_price_history
  title: Inspect BestPrice price history
  summary: Return 30/90/180-day minimum and median price windows plus a daily series for one product.
  required: [product_id]
  optional: [period_days]
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  input_schema: ../json-schema/bestprice-get-price-history-input.json
  output_schema: ../json-schema/bestprice-get-price-history-output.json
  limits: >-
    period_days is 30, 90 or 180 (default 180). Methodology is declared in-band as
    methodology_id = bestprice_daily_min_v1. The tool makes no forward price prediction.
resources:
- uri: ui://bestprice/shopping-results-v1.html
  name: bestprice-shopping-results
  mime_type: text/html;profile=mcp-app
  note: Optional MCP Apps UI card. Structured content remains authoritative for clients that do not render it.
- uri: mcp://server-card.json
  name: bestprice-server-card
  mime_type: application/json
prompts:
  supported: false
  note: prompts/list returns JSON-RPC -32601 Method not found. Example prompts are instead published
    in the provider's apis.json under prompts[].type AgentPrompt.
write_surface: false
safety:
  read_only: true
  note: >-
    Every published tool is read-only and annotated readOnlyHint=true / destructiveHint=false. The
    service cannot place an order, take a payment, modify a cart, or return a direct merchant URL —
    it returns a signed, short-lived BestPrice landing link instead, which the provider documents as
    non-billable until the shopper picks a merchant.
observability:
  request_id_header: x-request-id
  note: Every MCP response carried an x-request-id UUID. SECURITY.md asks reporters to include it.
