tools:
- name: get_shopping_decision
  title: Get a BestPrice shopping decision
  summary: 'Runs the BestPrice Shopping Brain (shared with BestPrice Ask): an evidence-backed recommendation, need-based
    comparison, or read-only basket plan with reasons, trade-offs, typed attributes, evidence references and explicit
    unknowns.'
  required:
  - message
  optional:
  - postal_code
  - history
  - evidence_detail
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input_schema: ../json-schema/bestprice-get-shopping-decision-input.json
  output_schema: ../json-schema/bestprice-get-shopping-decision-output.json
  ui_resource: ui://bestprice/shopping-results-v1.html
  limits: message 1-2000 chars; history up to 12 turns; postal_code ^(?:[1-7][0-9]{4}|8[0-5][0-9]{3})$ and required
    for a completed basket plan; baskets name 2-5 product-family slots or at least two exact bp_<id> products; evidence_detail
    summary (default) or full.
- name: search_products
  title: Search BestPrice products
  summary: Find canonical grouped BestPrice products from a name, model, category, GTIN/EAN or natural-language
    need; returns product ids and the catalog minimum price before shipping.
  required:
  - query
  optional:
  - locale
  - country
  - price_min
  - price_max
  - required_features
  - sort
  - limit
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input_schema: ../json-schema/bestprice-search-products-input.json
  output_schema: ../json-schema/bestprice-search-products-output.json
  ui_resource: ui://bestprice/shopping-results-v1.html
  limits: limit 1-8 (default 8); query 2-400 chars in the live schema (the README table says 2-200); locale const
    el-GR, country const GR; required_features max 10.
- name: compare_offers
  title: Compare BestPrice offers
  summary: Compare current merchant offers for one exact product, separating item price, shipping and delivered
    total (delivered totals need a Greek postal code).
  required:
  - product_id
  optional:
  - postal_code
  - objective
  - in_stock_only
  - minimum_merchant_rating
  - limit
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input_schema: ../json-schema/bestprice-compare-offers-input.json
  output_schema: ../json-schema/bestprice-compare-offers-output.json
  ui_resource: ui://bestprice/shopping-results-v1.html
  limits: limit 1-10 (default 10); product_id ^bp_[0-9]{10}$; postal_code is now OPTIONAL (it was required in 1.5.1)
    and without it delivered totals stay unknown; objective lowest_total_cost | lowest_item_price | merchant_rating.
- name: get_price_history
  title: Inspect BestPrice price history
  summary: Summarise how a product price moved over 30, 90 or 180 days against its 180-day median.
  required:
  - product_id
  optional:
  - period_days
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input_schema: ../json-schema/bestprice-get-price-history-input.json
  output_schema: ../json-schema/bestprice-get-price-history-output.json
  ui_resource: ui://bestprice/shopping-results-v1.html
  limits: period_days 30, 90 or 180 (default 180). No forward price prediction.
resources:
- uri: ui://bestprice/shopping-results-v1.html
  name: bestprice-shopping-results
