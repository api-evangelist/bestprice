note: 'Updated 2026-09-25. The provider README (Protocol details, "Measured against the live endpoint on 24 September
  2026") now documents per-client rate limiting and how exhaustion is signalled: HTTP 429, JSON-RPC error -32029
  and a Retry-After header. It publishes no number or window, so limit/window are left unset rather than guessed.
  It also documents a 256 KiB request-body cap (413) and a 12-second request deadline, recorded under request_limits
  because they bound a request, not a rate. The 2026-08-27 pass (source: https://www.bestprice.gr/mcp (connection
  guide, tool limits and FAQ), https://github.com/TheBestCo/bestprice-mcp/blob/main/PROVIDER_SETUP.md, and the response
  headers observed on live anonymous tools/call requests to https://mcp.bestprice.gr/mcp on 2026-08-27.) observed
  no rate-limit headers and no 429 in five anonymous calls; that observation is kept under x-evidence.'
