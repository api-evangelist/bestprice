note: >-
  BestPrice publishes no request-rate limit for the public MCP endpoint, and none was observable.
  Live responses carried only x-request-id, cache-control: no-cache, no-transform and
  x-accel-buffering: no — no RateLimit-*, X-RateLimit-* or Retry-After header appeared on any of the
  five successful calls made during this pass, and no 429 was produced. What the provider DOES
  publish are per-call result caps, recorded below as result_limits; they bound the size of a
  response, not the number of requests, and should not be read as a rate limit.
