note: >-
  BestPrice ships NO client SDK in any language and no library on any package registry. What it
  distributes instead is CONNECTION metadata — extension and plugin manifests that point a host at the
  same public endpoint. The repository's own package.json is marked "private": true and there is no
  npm, PyPI, Maven, NuGet, Go, RubyGems, Packagist or crates.io publication under any BestPrice name.
  That is a coherent choice for a keyless remote MCP server (there is nothing to authenticate and no
  transport to wrap) but it means an integrator writing code against this service writes it against
  MCP, not against a BestPrice library.
